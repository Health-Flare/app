name: health_flare_csv_import
description: CLI tool to import CSV data into a Health Flare Isar database.
version: 1.0.0

environment:
  sdk: ^3.0.0

# No Flutter dependency: this is a plain Dart CLI project.

dependencies:
  isar_community: 3.3.2 # pinned: must match isar_community_generator below
  args: ^2.6.0
  csv: ^8.0.0

dev_dependencies:
  lints: ^6.0.0
  # Regenerate lib/isar_models/*.g.dart after an Isar bump (the "isar"
  # Renovate group moves these together):
  #   dart run build_runner build --delete-conflicting-outputs
  build_runner: any
  isar_community_generator: 3.3.2
  test: ^1.25.0
