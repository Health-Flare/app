name: Regenerate goldens

# Manual only. Golden images in test/goldens/ must be captured on the same
# platform CI compares them against (ubuntu-latest): generating them
# locally on macOS produces small but real pixel diffs from anti-aliasing on
# rounded/circular shapes and icons, even with a platform-stable test font
# for text. Run this after an intentional visual change, then download the
# "goldens" artifact from the run and copy the PNGs into test/goldens/.
on:
  workflow_dispatch: {}

# Least privilege (#107): the token can only read the repo unless a job
# below asks for more.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  regen-goldens:
    name: Update golden files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Update goldens
        run: flutter test --update-goldens test/golden

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldens
          path: test/goldens/*.png
