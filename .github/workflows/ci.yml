name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency report: every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

# A PR triggers both `push` (to its branch, previously) and `pull_request`: 
# restricting `push` to main above removes that double-run. This group also
# cancels a stale run when new commits land on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Flutter version pinned here: update in one place when upgrading.
env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # ── 0. Change detection ───────────────────────────────────────────────────
  # Debug builds only run on a PR when something that can break a native
  # build changed: platform folders, dependencies, or the build workflows
  # themselves. Dart-only changes are covered by analyze + tests; a debug
  # build adds minutes and rarely catches anything they miss. Every push to
  # main builds regardless, and build.yml can be run by hand on any ref.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      # Anything that can affect analysis, formatting, or test/build output.
      # A PR that only touches docs/metadata (README, docs/*.md, AGENTS.md,
      # llms.txt, CODEOWNERS, issue templates, screenshots...) sets this
      # false, which skips the Flutter toolchain jobs below entirely rather
      # than running them for no reason. Keep this list as-broad-as-native
      # plus the Dart/asset/tooling paths those jobs actually read.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'windows/**'
              - 'linux/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'scripts/check_macos_icon.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build.yml'
            code:
              - 'lib/**'
              - 'test/**'
              - 'test_driver/**'
              - 'integration_test/**'
              - 'tool/**'
              - 'tools/**'
              - 'scripts/**'
              - 'third_party/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build.yml'

  # ── 1. Dependencies ───────────────────────────────────────────────────────
  flutter-pub-get:
    name: Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check for discontinued direct packages
        run: |
          # Only fail on discontinued *direct* dependencies: transitive ones
          # (e.g. build_resolvers, build_runner_core) are outside our control.
          DIRECT=$(flutter pub outdated 2>&1 \
            | awk '/direct dependencies:/{found=1} /transitive dependencies:/{found=0} found')
          if echo "$DIRECT" | grep -q "(discontinued)"; then
            echo "❌ A direct dependency is discontinued. Run 'flutter pub outdated'."
            echo "$DIRECT" | grep "(discontinued)"
            exit 1
          fi

  # ── 2. URL / offline scan ─────────────────────────────────────────────────
  url-scan:
    name: Offline integrity scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for hardcoded URLs in Dart source
        run: bash scripts/check_urls.sh
      - name: Verify google_fonts is not a dependency
        run: |
          if grep -q "google_fonts" pubspec.yaml; then
            echo "❌ google_fonts found in pubspec.yaml: all fonts must be bundled as assets."
            exit 1
          fi
      - name: Verify no google_fonts imports in lib/
        run: |
          if grep -rl "package:google_fonts" lib/; then
            echo "❌ google_fonts import found in lib/. Remove it: fonts are bundled."
            exit 1
          fi

  # The F-Droid build compiles libisar from third_party/isar-community, which
  # must match Isar in pubspec.lock. The F-Droid job is too slow for every
  # PR, so check the pin here: #202 bumped Isar alone and only the next
  # F-Droid run noticed. No submodule checkout; one ls-remote.
  isar-pin:
    name: Isar source pin
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Submodule tag matches pubspec.lock
        run: bash scripts/fdroid/check_isar_pin.sh

  # ── 3. Formatting ──────────────────────────────────────────────────────────
  dart-format:
    name: Formatting
    runs-on: ubuntu-latest
    needs: [changes, flutter-pub-get]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed lib/ test/

  # ── 4. Static analysis ────────────────────────────────────────────────────
  flutter-analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: [changes, flutter-pub-get]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Analyse
        run: flutter analyze --fatal-infos

  # ── 5. Tests ──────────────────────────────────────────────────────────────
  flutter-test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, flutter-pub-get]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Run tests
        run: flutter test --reporter=github

  # ── 5b. Tool packages ─────────────────────────────────────────────────────
  # tools/csv_import and scripts/isar_codegen are their own Dart packages,
  # excluded from the root analysis, so nothing above resolves or builds
  # them. Renovate still bumps their dependencies: csv 8 and Isar 3.3.2 each
  # broke csv_import with CI green (#177).
  tool-packages:
    name: Tool packages
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: "csv_import: analyze and test"
        working-directory: tools/csv_import
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --reporter=github
      # The root pub get gives `dart format` the repo's analysis options;
      # without it, format falls back to defaults and rewrites everything.
      - name: "isar_codegen: generated code is current"
        run: |
          flutter pub get
          bash scripts/generate_isar.sh
          dart format lib/data
          if ! git diff --exit-code --stat -- lib; then
            echo "::error::Generated Isar code is out of date. Run 'bash scripts/generate_isar.sh', then 'dart format lib/data', and commit the result."
            exit 1
          fi

  # ── 6. Gates ──────────────────────────────────────────────────────────────
  # The single required status check for merging (set in the "Main"
  # ruleset). Add new gate jobs to `needs` here rather than to the ruleset.
  gates:
    name: CI gates
    runs-on: ubuntu-latest
    needs: [changes, flutter-pub-get, url-scan, isar-pin, dart-format, flutter-analyze, flutter-test, tool-packages]
    if: always() && github.event_name != 'schedule'
    steps:
      # 'skipped' is expected now, not a failure: every gate job below is
      # conditional on `changes.outputs.code`, so a docs/metadata-only PR
      # (README, docs/*.md, AGENTS.md, llms.txt, CODEOWNERS, issue
      # templates...) skips all of them on purpose. Only treat a gate as
      # not passed if it actually ran and failed, or was cancelled.
      - name: All gates passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All gates passed."
      - name: A gate failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more gates did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1

  # ── 7. Debug builds ───────────────────────────────────────────────────────
  # Not required for merge. Runs on push to main, and on PRs that touch
  # native code or dependencies. Same workflow as the manual "Debug builds".
  builds:
    name: Debug builds
    needs: [changes, gates]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.native == 'true')
    uses: ./.github/workflows/build.yml
    with:
      platforms: all

  # Linux desktop build was commented out here while failing; removed.
  # Tracked in docs/features/linux-windows.feature.

  # ── 8. Weekly dependency report (scheduled) ──────────────────────────────
  dependency-audit:
    name: Weekly dependency report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Report outdated packages
        run: bash scripts/check_deps.sh
