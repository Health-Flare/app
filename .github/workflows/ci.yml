name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency report: every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

# A PR triggers both `push` (to its branch, previously) and `pull_request`: 
# restricting `push` to main above removes that double-run. This group also
# cancels a stale run when new commits land on the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Flutter version pinned here: update in one place when upgrading.
env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # ── 0. Change detection ───────────────────────────────────────────────────
  # Debug builds only run on a PR when something that can break a native
  # build changed: platform folders, dependencies, or the build workflows
  # themselves. Dart-only changes are covered by analyze + tests; a debug
  # build adds minutes and rarely catches anything they miss. Every push to
  # main builds regardless, and build.yml can be run by hand on any ref.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            native:
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'windows/**'
              - 'linux/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'scripts/check_macos_icon.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build.yml'

  # ── 1. Dependencies ───────────────────────────────────────────────────────
  flutter-pub-get:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check for discontinued direct packages
        run: |
          # Only fail on discontinued *direct* dependencies: transitive ones
          # (e.g. build_resolvers, build_runner_core) are outside our control.
          DIRECT=$(flutter pub outdated 2>&1 \
            | awk '/direct dependencies:/{found=1} /transitive dependencies:/{found=0} found')
          if echo "$DIRECT" | grep -q "(discontinued)"; then
            echo "❌ A direct dependency is discontinued. Run 'flutter pub outdated'."
            echo "$DIRECT" | grep "(discontinued)"
            exit 1
          fi

  # ── 2. URL / offline scan ─────────────────────────────────────────────────
  url-scan:
    name: Offline integrity scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for hardcoded URLs in Dart source
        run: bash scripts/check_urls.sh
      - name: Verify google_fonts is not a dependency
        run: |
          if grep -q "google_fonts" pubspec.yaml; then
            echo "❌ google_fonts found in pubspec.yaml: all fonts must be bundled as assets."
            exit 1
          fi
      - name: Verify no google_fonts imports in lib/
        run: |
          if grep -rl "package:google_fonts" lib/; then
            echo "❌ google_fonts import found in lib/. Remove it: fonts are bundled."
            exit 1
          fi

  # ── 3. Formatting ──────────────────────────────────────────────────────────
  dart-format:
    name: Formatting
    runs-on: ubuntu-latest
    needs: flutter-pub-get
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check dart format
        run: dart format --output=none --set-exit-if-changed lib/ test/

  # ── 4. Static analysis ────────────────────────────────────────────────────
  flutter-analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: flutter-pub-get
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Analyse
        run: flutter analyze --fatal-infos

  # ── 5. Tests ──────────────────────────────────────────────────────────────
  flutter-test:
    name: Tests
    runs-on: ubuntu-latest
    needs: flutter-pub-get
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Run tests
        run: flutter test --reporter=github

  # ── 6. Gates ──────────────────────────────────────────────────────────────
  # The single required status check for merging (set in the "Main"
  # ruleset). Add new gate jobs to `needs` here rather than to the ruleset.
  gates:
    name: CI gates
    runs-on: ubuntu-latest
    needs: [flutter-pub-get, url-scan, dart-format, flutter-analyze, flutter-test]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: All gates passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "All gates passed."
      - name: A gate failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more gates did not pass: ${{ join(needs.*.result, ', ') }}"
          exit 1

  # ── 7. Debug builds ───────────────────────────────────────────────────────
  # Not required for merge. Runs on push to main, and on PRs that touch
  # native code or dependencies. Same workflow as the manual "Debug builds".
  builds:
    name: Debug builds
    needs: [changes, gates]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.native == 'true')
    uses: ./.github/workflows/build.yml
    with:
      platforms: all

  # Linux desktop build was commented out here while failing; removed.
  # Tracked in docs/features/linux-windows.feature.

  # ── 8. Weekly dependency report (scheduled) ──────────────────────────────
  dependency-audit:
    name: Weekly dependency report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Report outdated packages
        run: bash scripts/check_deps.sh
