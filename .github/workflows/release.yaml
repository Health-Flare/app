name: Release APK

# Triggers on any version tag, e.g. v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

# Flutter version kept in sync with ci.yaml: update both together.
# Least privilege (#107): the token can only read the repo unless a job
# below asks for more.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  build-release-apk:
    name: Build & publish release APK
    runs-on: ubuntu-latest

    # Required for github.token to create releases on GitHub.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch $FLUTTER_VERSION \
            https://github.com/flutter/flutter.git $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      # ── Signing setup ────────────────────────────────────────────────────────
      # Add these secrets in your repository settings:
      #   KEYSTORE_BASE64   base64-encoded .jks / .keystore file
      #                     Generate with: base64 -i release.keystore | pbcopy
      #   STORE_PASSWORD    storePassword value from key.properties
      #   KEY_ALIAS         keyAlias value from key.properties
      #   KEY_PASSWORD      keyPassword value from key.properties
      # Fail fast if a signing secret is missing or empty (#106). The Gradle
      # build also refuses, but this names the secret.
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or not set"
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version tag
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/healthflare-${GITHUB_REF_NAME}.apk"

      # Refuse to publish anything not signed with the release key (#106).
      # Expected fingerprint: android/release-signing.sha256.
      - name: Verify release signature
        run: scripts/release/verify_android_signature.sh "build/app/outputs/flutter-apk/healthflare-${GITHUB_REF_NAME}.apk"

      # ── Publish ──────────────────────────────────────────────────────────────
      # github.api_url resolves to https://api.github.com; github.token is
      # auto-provided by GitHub Actions.
      - name: Create or get release
        run: |
          # If the release was already created (e.g. via the GitHub UI), reuse it.
          HTTP_CODE=$(curl -s -o release.json -w "%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
          if [ "$HTTP_CODE" != "200" ]; then
            curl -sf -X POST \
              -H "Authorization: token ${{ github.token }}" \
              -H "Content-Type: application/json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
              -d "{
                \"tag_name\": \"${GITHUB_REF_NAME}\",
                \"name\": \"Health Flare ${GITHUB_REF_NAME}\",
                \"body\": \"Release ${GITHUB_REF_NAME}\",
                \"draft\": false,
                \"prerelease\": false
              }" \
              -o release.json
          fi
          echo "Release ID: $(jq '.id' release.json)"

      # The release response includes an upload_url field. GitHub uses a
      # separate upload host (uploads.github.com); extracting upload_url
      # handles this transparently.
      - name: Upload APK to release
        run: |
          # Strip the URI template suffix {?name,label} before appending our params
          UPLOAD_URL=$(jq -r '.upload_url' release.json | sed 's/{?name,label}//')
          APK="build/app/outputs/flutter-apk/healthflare-${GITHUB_REF_NAME}.apk"
          curl -sf -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=healthflare-${GITHUB_REF_NAME}.apk" \
            --data-binary "@${APK}"
