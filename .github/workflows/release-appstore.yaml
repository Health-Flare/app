name: Release App Store

# Triggers on any version tag, e.g. v0.1.0
# NOTE: Each upload needs a higher CFBundleVersion (the "+N" build number in
# pubspec.yaml's `version:`) than the last, same as the Play Store workflow.
# Bump it before tagging or App Store Connect rejects the upload.
on:
  push:
    tags:
      - "v*.*.*"

# Flutter version kept in sync with ci.yml — update both together.
env:
  FLUTTER_VERSION: "3.41.1"

jobs:
  build-and-publish-appstore:
    name: Build & publish IPA to App Store Connect (TestFlight)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Signing setup ────────────────────────────────────────────────────────
      # App Store Connect API key + automatic signing: xcodebuild resolves and
      # renews the Distribution certificate + App Store provisioning profile
      # itself via -allowProvisioningUpdates, so there's no manually-exported
      # .p12/.mobileprovision pair to keep in sync (contrast with the .p12
      # approach in release-macos.yaml).
      #   APPSTORE_API_KEY_BASE64   base64-encoded .p8 private key.
      #                             Generate in App Store Connect → Users and
      #                             Access → Integrations → App Store Connect
      #                             API → "+" (download once, Apple won't show
      #                             it again). base64 -i AuthKey_XXXX.p8 | pbcopy
      #   APPSTORE_API_KEY_ID       Key ID shown next to the key on that page.
      #   APPSTORE_API_ISSUER_ID    Issuer ID shown at the top of the same page.
      #   APPLE_TEAM_ID             10-char Developer Team ID (Developer portal
      #                             → Membership, or App Store Connect → App
      #                             Information → Apple ID/Team).
      - name: Install App Store Connect API key
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      # ── Build ────────────────────────────────────────────────────────────────
      # `flutter build ipa` doesn't expose -allowProvisioningUpdates or the
      # authenticationKey* flags (checked via `flutter build ipa --help` —
      # no passthrough exists), so the archive/export steps call xcodebuild
      # directly instead. `flutter build ios --release --no-codesign` still
      # does the Dart/Flutter half (compiles the app, writes
      # Generated.xcconfig, embeds Flutter.framework) that xcodebuild needs
      # before it can archive.
      - name: Prepare Flutter build
        run: flutter build ios --release --no-codesign

      - name: Archive
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      - name: Export IPA
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"

      # Kept as a downloadable artifact regardless of whether the automated
      # upload below succeeds, so a failed/rejected altool run still leaves
      # something you can hand to Transporter (or altool) manually — this
      # workflow is untested end-to-end, see Phase 4 of
      # docs/apple-app-store-checklist.md.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthflare-ios-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ── Publish ──────────────────────────────────────────────────────────────
      # Prerequisites (one-time, done outside CI — see Phase 1/2 of
      # docs/apple-app-store-checklist.md): Developer Program enrollment
      # active, App ID registered, app record created in App Store Connect.
      #
      # Per the Play Store workflow's equivalent comment: the very first
      # upload for a new app may need to go through Xcode/Transporter
      # manually before App Store Connect accepts automated uploads for it —
      # unconfirmed for App Store Connect specifically, verify on the first
      # real run rather than assuming this workflow works untested.
      - name: Upload to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
