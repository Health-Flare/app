name: Release App Store

# Triggers on any version tag, e.g. v0.1.0
# NOTE: Each upload needs a higher CFBundleVersion (the "+N" build number in
# pubspec.yaml's `version:`) than the last, same as the Play Store workflow.
# Bump it before tagging or App Store Connect rejects the upload.
#
# Also supports manual dispatch — useful while iterating on the signing/build
# setup, since it lets you re-run against the current build number without
# cutting a new version tag each time. A manual run still uploads for real if
# it gets that far, so only dispatch it when you actually mean to.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Flutter version kept in sync with ci.yml — update both together.
env:
  FLUTTER_VERSION: "3.41.1"

jobs:
  build-and-publish-appstore:
    name: Build & publish IPA to App Store Connect (TestFlight)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Signing setup ────────────────────────────────────────────────────────
      # Manual signing with a pre-created Distribution cert + provisioning
      # profile. Automatic signing (-allowProvisioningUpdates + API key) was
      # tried first and failed 6 straight times — see docs/apple-app-store-
      # checklist.md Phase 4 for the full log. Root cause: xcodebuild's
      # automatic-signing resolution doesn't reliably create a *first-ever*
      # Distribution profile headlessly, and once the profile existed
      # (created manually via Xcode locally), the command-line
      # CODE_SIGN_STYLE=Automatic override then conflicted with the
      # profile now committed into project.pbxproj. Manual signing matches
      # exactly what was proven to work locally: Product → Archive with
      # "Automatically manage signing" unchecked and the profile selected
      # by hand.
      #   APPSTORE_DISTRIBUTION_CERT_BASE64      base64-encoded .p12 export of
      #                                           the Apple Distribution cert
      #                                           + private key from Keychain
      #                                           Access (right-click the
      #                                           certificate → Export).
      #   APPSTORE_DISTRIBUTION_CERT_PASSWORD    the export password chosen
      #                                           for that .p12 — also reused
      #                                           below as the ephemeral CI
      #                                           keychain's unlock password.
      #   APPSTORE_PROVISIONING_PROFILE_BASE64   base64-encoded .mobileprovision
      #                                           for the "Health Flare App
      #                                           Store" profile (Developer
      #                                           portal → Profiles).
      #   APPSTORE_API_KEY_BASE64/_KEY_ID/_ISSUER_ID   still used for the final
      #                                           altool upload step only —
      #                                           that step never failed, only
      #                                           archiving did, so it's
      #                                           unchanged. See git history
      #                                           for how these were generated.
      #   APPLE_TEAM_ID                          10-char Developer Team ID.
      - name: Install App Store Connect API key
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Import Distribution certificate
        env:
          APPSTORE_DISTRIBUTION_CERT_BASE64: ${{ secrets.APPSTORE_DISTRIBUTION_CERT_BASE64 }}
          APPSTORE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPSTORE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "$APPSTORE_DISTRIBUTION_CERT_BASE64" | base64 --decode > distribution.p12
          security create-keychain -p "$APPSTORE_DISTRIBUTION_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPSTORE_DISTRIBUTION_CERT_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import distribution.p12 -k build.keychain \
            -P "$APPSTORE_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$APPSTORE_DISTRIBUTION_CERT_PASSWORD" build.keychain
          rm distribution.p12
          # `security default-keychain` alone doesn't add build.keychain to the
          # *search list* that `xcodebuild -exportArchive` consults separately
          # from Archive's codesign lookup — attempt 7 archived successfully
          # (proving the cert/profile were valid) but Export still failed with
          # "No signing certificate 'iOS Distribution' found" until this list
          # includes build.keychain. Attempt 8 tried `-s build.keychain
          # login.keychain-db`, which *replaced* the default search list
          # instead of extending it — dropping /Library/Keychains/System.keychain,
          # which holds Apple's WWDR intermediate cert needed to validate the
          # trust chain for any Apple-issued certificate. Archive's codesign
          # lookup tolerated the missing chain; Export's stricter
          # `security find-identity -v` style check didn't, so it reported
          # zero valid identities regardless of ExportOptions.plist's
          # signingCertificate value. Preserve the existing list instead of
          # overwriting it.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[",]//g')
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS

      # Attempt 11's diagnostic step proved the identity is valid
      # (`security find-identity -v` finds it) and the profile is correctly
      # installed, seconds before `xcodebuild -exportArchive` still reports
      # both as not found. That gap between "security CLI says valid" and
      # "Xcode's own export validation says not found" is the signature of
      # a missing/outdated WWDR intermediate certificate in the trust
      # chain — `security find-identity`'s validity check is more lenient
      # than Xcode's internal App Store distribution trust validation.
      # macos-latest runner images don't reliably ship the current
      # intermediate. Install the known intermediates directly.
      - name: Install Apple WWDR intermediate certificates
        run: |
          for cert in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG6; do
            curl -sf -o "${cert}.cer" "https://www.apple.com/certificateauthority/${cert}.cer"
            security import "${cert}.cer" -k build.keychain
            rm "${cert}.cer"
          done

      - name: Install provisioning profile
        env:
          APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision \
            | plutil -extract UUID xml1 -o - - \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

      # Temporary — attempts 7-10 all failed at Export with "No signing
      # certificate found" despite three different theories (search list
      # missing build.keychain, then missing System.keychain, then wrong
      # signingCertificate selector). Print the actual state instead of
      # guessing a fourth time.
      - name: Debug signing state
        run: |
          echo "== keychain search list =="
          security list-keychains -d user
          echo "== valid codesigning identities (build.keychain) =="
          security find-identity -v -p codesigning build.keychain || true
          echo "== all identities incl. invalid (build.keychain) =="
          security find-identity -p codesigning build.keychain || true
          echo "== installed provisioning profiles =="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "== profile Name + TeamName =="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "--- $f ---"
            security cms -D -i "$f" > /tmp/profile_plist.xml
            plutil -extract Name xml1 -o - /tmp/profile_plist.xml || true
            plutil -extract TeamName xml1 -o - /tmp/profile_plist.xml || true
          done

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.healthflare.app.healthflare</key>
              <string>Health Flare App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      # ── Build ────────────────────────────────────────────────────────────────
      # `flutter build ios --release --no-codesign` does the Dart/Flutter half
      # (compiles the app, writes Generated.xcconfig, embeds
      # Flutter.framework) that xcodebuild needs before it can archive.
      - name: Prepare Flutter build
        run: flutter build ios --release --no-codesign

      # No signing flags/overrides needed here — project.pbxproj already has
      # CODE_SIGN_STYLE=Manual, PROVISIONING_PROFILE_SPECIFIER, and
      # DEVELOPMENT_TEAM committed for the Release configuration (see the
      # "fix(ios): manual Distribution signing" commit), matching exactly
      # what the certificate/profile installed above provide.
      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # Kept as a downloadable artifact regardless of whether the automated
      # upload below succeeds, so a failed/rejected altool run still leaves
      # something you can hand to Transporter (or altool) manually — this
      # workflow is untested end-to-end, see Phase 4 of
      # docs/apple-app-store-checklist.md.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthflare-ios-${{ github.ref_name }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # ── Publish ──────────────────────────────────────────────────────────────
      # Prerequisites (one-time, done outside CI — see Phase 1/2 of
      # docs/apple-app-store-checklist.md): Developer Program enrollment
      # active, App ID registered, app record created in App Store Connect.
      #
      # Per the Play Store workflow's equivalent comment: the very first
      # upload for a new app may need to go through Xcode/Transporter
      # manually before App Store Connect accepts automated uploads for it —
      # unconfirmed for App Store Connect specifically, verify on the first
      # real run rather than assuming this workflow works untested.
      - name: Upload to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
