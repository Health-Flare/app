AutoName: Health Flare

RepoType: git
Repo: https://github.com/Health-Flare/app.git

Builds:
  - versionName: 1.11.0
    versionCode: 1015
    commit: fd7d96c42d1b87ff3dbc02d411114c7b2a152578
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev make libclang-dev rustup
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E 's/^ *FLUTTER_VERSION:\ "(.*)"/\1/p' .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - bash scripts/fdroid/strip_gms_location.sh
      - cp scripts/fdroid/isar-Cargo.lock third_party/isar-community/Cargo.lock
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - rustup default 1.88.0
      - bash scripts/fdroid/build_isar.sh armv7
      - HEALTHFLARE_UNSIGNED_RELEASE=true $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

